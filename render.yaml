services:
  # The game page (static)
  - type: web
    name: draft-clash
    runtime: static
    buildCommand: python3 build.py
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
  # Room server for online host/join play (WebSocket)
  - type: web
    name: draft-clash-rooms
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
